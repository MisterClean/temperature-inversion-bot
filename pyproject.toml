[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temperature-inversion-bot"
version = "0.1.0"
description = "Modular daily temperature inversion bot for microblogging services"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Temperature Inversion Bot" }
]
dependencies = [
  "atproto>=0.0.65,<0.1",
  "httpx>=0.27,<1",
  "APScheduler>=3.11,<4",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "pytest-cov>=5,<7"
]

[project.scripts]
temp-inversion-bot = "temp_inversion_bot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
